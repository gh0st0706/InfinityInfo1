services:
  - type: web
    name: infinityinfo-api
    runtime: python
    plan: free
    rootDir: infinityinfo/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: HUNTER_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
